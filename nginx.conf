server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # O container recebe HTTP do proxy do Coolify, entao $scheme aqui e "http". Sem isto,
  # todo redirect vira um Location absoluto em http:// e o visitante paga um salto extra
  # ate voltar ao https. Com absolute_redirect off, o Location sai relativo e o navegador
  # resolve no esquema em que ja esta.
  absolute_redirect off;

  # Ambiente de homologação: remover este header no lançamento com o domínio oficial.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # HTML e raiz sempre revalidam; assets podem ser cacheados por uma semana.
  expires -1;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 7d;
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
  }

  # /para-voce/ não tem página própria — só a filha wb-atualiza/. Sem isto, o diretório
  # sem index responderia 403 em vez de levar a algum lugar útil.
  location = /para-voce/ {
    return 302 /para-voce/wb-atualiza/;
  }

  # A rodada de 26-27/08 foi promovida para a raiz em 28/08/2026, e /previa/ deixou de
  # existir. Os dois slugs de homologacao levam agora ao equivalente na raiz; 302 para
  # nao fixar em cache um destino que muda a cada rodada.
  location = /preview {
    return 302 /;
  }

  location = /previa {
    return 302 /;
  }

  location ~ ^/previa/(.*)$ {
    return 302 /$1$is_args$args;
  }

  location ~ ^/preview/(.*)$ {
    return 302 /$1$is_args$args;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Página 404 do próprio site (cobre também as URLs /v2/… aposentadas na migração
  # do site para a raiz do domínio, em 14/08/2026).
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
